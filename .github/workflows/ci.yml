name: CI

# Los checks livianos corren en ubuntu-latest en paralelo con el job pesado,
# también en ubuntu-latest (temporal, ver comentario en el job backend).
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:test@localhost:55432/postgres
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: test-service-key
  CORS_ORIGIN: http://localhost:5173
  REDIS_URL: redis://localhost:6379
  REDIS_ENABLED: false
  GOOGLE_CLIENT_ID: test-google-client-id
  GOOGLE_CLIENT_SECRET: test-google-client-secret
  GOOGLE_REDIRECT_URI: http://localhost:3100/auth/google/callback
  ENCRYPTION_KEY: test-encryption-key-minimum-32-chars!!
  DATA_ENCRYPTION_KEY: test-data-encryption-key-minimum-32-chars!!
  OAUTH_STATE_SECRET: test-oauth-state-secret-minimum-32chars
  GROQ_API_KEY: ''
  OPENCODE_API_KEY: ''
  OPENROUTER_API_KEY: ''
  # Evita CRLF y rutas largas en el checkout de Windows sin tocar la config global de git
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.longpaths
  GIT_CONFIG_VALUE_1: 'true'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const code = files.some(
              (file) =>
                !file.filename.endsWith('.md') &&
                !file.filename.startsWith('docs/'),
            );
            core.setOutput('code', String(code));

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PNPM_STORE_DIR: /home/runner/.pnpm-store
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pnpm store and Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PNPM_STORE_DIR }}
            /home/runner/.cache/prisma
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Money decimal guard
        run: pnpm lint:money

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec jest --coverage --coverageReporters=text-summary --passWithNoTests

  backend:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    # TEMPORAL: corre en runners de GitHub mientras la PC de casa (runner
    # self-hosted "personal-os") está apagada. Para volver: restaurar
    # runs-on: [self-hosted, personal-os], shell pwsh y los pasos Docker/limpieza
    # desde el historial de git (commit anterior a la rama ci/github-hosted-runner).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      PGPASSWORD: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Stub Supabase roles for CI Postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, anon, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, anon, service_role;
          SQL

      - name: Prisma migrate deploy
        run: pnpm db:migrate:deploy

      - name: Prisma migrate diff (no drift)
        run: pnpm db:migrate:diff:check

      - name: E2E tests
        run: pnpm test:e2e

      - name: PostgreSQL integration and crash recovery
        run: pnpm test:integration
