name: CI

# Corre en el runner propio (PC casa) para no gastar minutos de GitHub Actions.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, personal-os]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # Evita CRLF en el checkout de Windows sin tocar la config global de git
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PG_CONTAINER: pos-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test@localhost:55432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: redis://localhost:6379
      REDIS_ENABLED: false
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3100/auth/google/callback
      ENCRYPTION_KEY: test-encryption-key-minimum-32-chars!!
      DATA_ENCRYPTION_KEY: test-data-encryption-key-minimum-32-chars!!
      OAUTH_STATE_SECRET: test-oauth-state-secret-minimum-32chars
      GROQ_API_KEY: ''
      OPENCODE_API_KEY: ''
      OPENROUTER_API_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Start CI Postgres (Docker, puerto 55432)
        run: |
          docker rm -f $env:PG_CONTAINER 2>$null
          docker run -d --name $env:PG_CONTAINER -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=test -e POSTGRES_DB=postgres -p 55432:5432 postgres:16-alpine
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo iniciar Postgres (Docker Desktop encendido?)' }
          for ($i = 0; $i -lt 30; $i++) {
            docker exec $env:PG_CONTAINER pg_isready -U postgres -h localhost 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          throw 'Postgres no quedo listo'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Stub Supabase roles for CI Postgres
        run: |
          $sql = @"
          DO `$`$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          `$`$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE AS `$`$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          `$`$;
          GRANT USAGE ON SCHEMA auth TO authenticated, anon, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, anon, service_role;
          "@
          $sql | docker exec -i $env:PG_CONTAINER psql -U postgres -d postgres -v ON_ERROR_STOP=1
          if ($LASTEXITCODE -ne 0) { throw 'Fallo el stub de roles' }

      - name: Prisma migrate deploy
        run: pnpm db:migrate:deploy

      - name: Prisma migrate diff (no drift)
        run: pnpm db:migrate:diff:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Money decimal guard
        run: pnpm lint:money

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec jest --coverage --coverageReporters=text-summary --passWithNoTests

      - name: E2E tests
        run: pnpm test:e2e

      - name: PostgreSQL integration and crash recovery
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:55432/postgres
        run: pnpm test:integration

      - name: Stop CI Postgres
        if: always()
        run: docker rm -f $env:PG_CONTAINER 2>$null; exit 0