packages:
  - '.'
  - 'packages/*'
allowBuilds:
  '@firebase/util': false
  '@nestjs/core': true
  '@openrouter/sdk': true
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@sentry/bundler-plugins@11.8.0'
  - '@sentry/core@11.8.0'
  - '@sentry/nestjs@11.8.0'
  - '@sentry/node@11.8.0'
  - '@sentry/opentelemetry@11.8.0'
  - '@sentry/server-runtime-injection@11.8.0'
  - '@sentry/server-utils@11.8.0'
overrides:
  axios: 1.20.0
  js-yaml@5: 5.2.2
  fast-uri: 3.1.8
  deepmerge-ts: ">=8.0.0"
  mysql2: ">=3.22.0"
  multer: 2.3.0
